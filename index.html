    <link rel="stylesheet" href="file:///C:/Users/super/Documents/JamesCoding/helpful_things_css.css">
    <meta charset="utf-8">
    <title>Helpful Things</title>

  <body>
    <div class="linksto">
      <button type="button" id="torandomnum">Random Number Generator</button>
      <button type="button" id="tofractions">Fraction simplifier</button>

    <div class="space">

    </div>
    <button type="button" id="fractions" class="totop">To mainpage</button>
    <div class="fractionsfunc">
      <div class="fractionsin">
        <input type="text" placeholder="Numerator" id="numerator" class="input">
        <input type="text" placeholder="Denominator" id="denominator" class="input">
      </div>
      <div class="fractionsdisplaydiv">
        <p id="fractionsdisplay">Simplified fractions will appear here.</p>
      </div>
    </div>
    <button type="button" id="simplify">Simplify</button>
